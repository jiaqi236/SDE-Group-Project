# Local development with a real PostgreSQL:  docker compose up --build  ->  http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campustask
      POSTGRES_USER: campustask
      POSTGRES_PASSWORD: localpassword
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campustask -d campustask"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      args:
        APP_VERSION: local-dev
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: campustask
      DB_USER: campustask
      DB_PASSWORD: localpassword
      DB_SSL: "false"
    ports:
      - "8080:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
